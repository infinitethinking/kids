<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Planning entraînements — O & L</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,calendar_month,close,delete,directions_bike,directions_run,edit,pool,save,settings,toggle_off,toggle_on,warning">
<style>
  .material-symbols-outlined{
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    font-size:20px;
    line-height:1;
    user-select:none;
    pointer-events:none;
  }
  :root{
    --ink:#1b2430;
    --paper:#f6f4ee;
    --line:#d9d3c4;
    --tri:#1f6f8b;      /* TriGenève */
    --tri-bg:#e4f0f3;
    --bmx:#c0522d;      /* BMX */
    --bmx-bg:#f7e6dc;
    --stade:#5a7a3a;    /* Stade Genève */
    --stade-bg:#e9f0e1;
    --o-color:#a7351e;  /* kid O tag */
    --l-color:#1e4f9e;  /* kid L tag */
    --warn:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 20px 60px;
  }
  h1{
    font-size:22px;
    letter-spacing:0.3px;
    margin:0 0 4px;
    font-weight:700;
  }
  .sub{
    font-size:13px;
    color:#6b6357;
    margin-bottom:18px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .legend{
    display:flex;
    gap:14px;
    font-size:12px;
    flex-wrap:wrap;
    margin-right:auto;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;}

  .icon-btn{
    width:36px;
    height:36px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-btn:hover{opacity:0.85;}
  .icon-btn:disabled{opacity:0.5;cursor:wait;}
  .icon-btn.ghost{
    background:#fff;
    color:var(--ink);
  }
  .icon-btn.danger{
    background:#fff;
    color:var(--warn);
    border-color:var(--warn);
  }
  .icon-btn.ok .material-symbols-outlined{
    font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
  }
  .icon-btn.err{
    background:var(--warn);
    border-color:var(--warn);
    color:#fff;
  }
  .icon-btn.open{
    background:var(--ink);
    color:var(--paper);
  }

  .save-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }
  .sync-status{
    font-size:11.5px;
    color:#6b6357;
    max-width:220px;
    line-height:1.3;
  }
  .sync-status.local{color:#8a5a12;}
  .sync-status.err{color:var(--warn);}

  .drawer-backdrop{
    position:fixed;
    inset:0;
    background:rgba(27,36,48,0.35);
    z-index:40;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .drawer-backdrop[hidden]{display:none;}
  .drawer{
    position:fixed;
    top:0;
    right:0;
    width:min(360px,100%);
    height:100%;
    background:var(--paper);
    z-index:50;
    transform:translateX(100%);
    transition:transform 0.2s ease;
    box-shadow:-8px 0 24px rgba(27,36,48,0.16);
    padding:18px 18px 32px;
    overflow:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .drawer-head h2{
    margin:0;
    font-size:16px;
  }
  .drawer-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:16px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
  }
  .drawer-field input{
    font-size:14px;
    font-weight:500;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .token-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .token-row input{flex:1;min-width:0;}
  .card-actions{
    position:absolute;
    top:2px;
    right:2px;
    display:flex;
    gap:0;
  }
  .card-actions .icon-btn{
    width:24px;
    height:24px;
    border:none;
    background:transparent;
    color:#8a8271;
    border-radius:4px;
  }
  .card-actions .icon-btn .material-symbols-outlined{
    font-size:18px;
    pointer-events:none;
  }
  .card-actions .del-btn{color:var(--warn);}
  .conflict-flag .material-symbols-outlined{
    font-size:15px;
    vertical-align:-3px;
    margin-right:2px;
  }
  .conflict-item .material-symbols-outlined{
    font-size:15px;
    vertical-align:-3px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
  }
  .day-col{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    min-height:120px;
    transition:background 0.12s ease, box-shadow 0.12s ease;
  }
  .day-col.drop-target{
    background:#eef3ea;
    box-shadow:inset 0 0 0 2px #9a9488;
  }
  .day-col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .day-col-head h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0;
    min-width:0;
    flex:1;
  }
  .day-col-head .icon-btn{
    flex-shrink:0;
    width:28px;
    height:28px;
  }

  .event{
    border-radius:8px;
    padding:8px 9px 9px;
    margin-bottom:8px;
    font-size:12px;
    border:1px solid transparent;
    position:relative;
    cursor:grab;
  }
  .event:hover{
    filter:brightness(0.98);
  }
  .event.dragging{
    opacity:0.35;
    cursor:grabbing;
  }
  .event.club-tri{background:var(--tri-bg);border-color:#bcd9e0;}
  .event.club-bmx{background:var(--bmx-bg);border-color:#e3bda6;}
  .event.club-stade{background:var(--stade-bg);border-color:#c6d8b4;}

  .event-head{
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding-right:72px;
  }
  .sport-icon{
    font-size:18px;
    line-height:1;
    margin-top:1px;
  }
  .event.club-tri .sport-icon{color:var(--tri);}
  .event.club-bmx .sport-icon{color:var(--bmx);}
  .event.club-stade .sport-icon{color:var(--stade);}
  .event-head .time{flex:1;}

  .event .time{
    font-weight:700;
    font-size:12px;
  }
  .event .activity{
    font-weight:700;
    margin-top:1px;
  }
  .event .loc{
    color:#5c564a;
    font-size:11px;
    margin-top:1px;
  }
  .event.optional{
    background:#eceae4 !important;
    border-color:#c5c0b5 !important;
    color:#5c564a;
    outline:2px dashed #9a9488;
    outline-offset:1px;
  }
  .event.optional .sport-icon{color:#8a8271 !important;}
  .event.optional .activity,
  .event.optional .time{color:#5c564a;}
  .event.conflict{
    outline:2px solid var(--warn);
    outline-offset:1px;
  }
  .event.optional.conflict{
    outline:2px dashed var(--warn);
  }
  .conflict-flag{
    color:var(--warn);
    font-size:10.5px;
    font-weight:700;
    margin-top:4px;
  }

  .kid-row{
    display:flex;
    gap:6px;
    margin-top:7px;
  }
  .kid-btn{
    flex:1;
    border-radius:6px;
    border:1px solid #b9b2a1;
    background:#fff;
    padding:4px 6px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    color:#8a8271;
    min-width:0;
  }
  .card-actions .icon-btn,
  .kid-btn{
    cursor:pointer;
  }
  .kid-btn.on-O{background:var(--o-color);border-color:var(--o-color);color:#fff;}
  .kid-btn.on-L{background:var(--l-color);border-color:var(--l-color);color:#fff;}
  .modal-kids{
    margin-top:0;
  }
  .modal-kids .kid-btn{
    padding:8px 10px;
    font-size:13px;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:80;
    background:rgba(27,36,48,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .modal-overlay[hidden]{display:none !important;}
  .edit-dialog{
    border:1px solid var(--line);
    border-radius:14px;
    padding:0;
    width:min(440px, calc(100vw - 24px));
    max-height:calc(100vh - 36px);
    overflow:auto;
    background:var(--paper);
    color:var(--ink);
    box-shadow:0 18px 50px rgba(27,36,48,0.28);
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 8px;
  }
  .modal-head h2{
    margin:0;
    font-size:16px;
  }
  .modal-form{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:6px 16px 16px;
  }
  .modal-form label{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-size:12px;
    font-weight:600;
  }
  .modal-form input,
  .modal-form select{
    font-size:14px;
    font-weight:500;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .modal-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .addr-wrap{position:relative;}
  .addr-suggest{
    margin:6px 0 0;
    padding:0;
    list-style:none;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    max-height:180px;
    overflow:auto;
  }
  .addr-suggest[hidden]{display:none;}
  .addr-hint{
    font-size:11px;
    font-weight:500;
    color:#8a8271;
    margin-top:4px;
  }
  .addr-suggest button{
    display:block;
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .addr-suggest button:hover,
  .addr-suggest button.active{
    background:#eceae4;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:8px;
  }
  .text-btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .text-btn.ghost{
    background:#fff;
    color:var(--ink);
  }
  .opt-switch{
    border:none;
    background:none;
    padding:4px 0;
    cursor:pointer;
    display:inline-flex;
    color:#8a8271;
  }
  .opt-switch .material-symbols-outlined{font-size:28px;pointer-events:none;}
  .opt-switch[aria-pressed="true"] .material-symbols-outlined{
    font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
    color:var(--ink);
  }

  .summary{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .summary .card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .summary h3{
    margin:0 0 8px;
    font-size:14px;
  }
  .summary h3.O{color:var(--o-color);}
  .summary h3.L{color:var(--l-color);}
  .summary ul{
    margin:0;
    padding-left:18px;
    font-size:12.5px;
    line-height:1.6;
  }
  .summary li .material-symbols-outlined{
    font-size:15px;
    vertical-align:-3px;
  }
  .empty{color:#8a8271;font-size:12.5px;}

  .week-summary{margin-top:30px;}
  .week-summary h3{font-size:14px;margin:0 0 12px;}
  .week-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
  }
  .day-summary-card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .day-summary-card h4{
    margin:0 0 8px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .day-summary-item{
    font-size:12.5px;
    margin-bottom:9px;
    padding-left:8px;
    border-left:3px solid var(--tri);
  }
  .day-summary-item.club-tri{border-left-color:var(--tri);}
  .day-summary-item.club-bmx{border-left-color:var(--bmx);}
  .day-summary-item.club-stade{border-left-color:var(--stade);}
  .day-summary-item .t{
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .day-summary-item .t .material-symbols-outlined{font-size:16px;}
  .day-summary-item .a{margin-top:1px;}
  .day-summary-item .kids{margin-top:3px;display:flex;gap:5px;}
  .kid-chip{
    font-size:10.5px;
    font-weight:700;
    padding:1px 7px;
    border-radius:999px;
    color:#fff;
  }
  .kid-chip.O{background:var(--o-color);}
  .kid-chip.L{background:var(--l-color);}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .summary{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<h1 id="pageTitle">Planning hebdomadaire — O &amp; L</h1>
<div class="sub" id="pageSub">Clique sur un enfant pour l'assigner. Glisse une séance vers un autre jour, ou double-clique pour la modifier.</div>

<div class="toolbar">
  <div class="legend">
    <span><i class="swatch" style="background:var(--bmx)"></i>BMX</span>
    <span><i class="swatch" style="background:var(--tri)"></i>TriGenève</span>
    <span><i class="swatch" style="background:var(--stade)"></i>Stade Genève</span>
  </div>
  <div class="save-bar">
    <button class="icon-btn ghost" id="settingsBtn" type="button" title="Réglages" aria-label="Réglages" aria-expanded="false" aria-controls="settingsDrawer">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <button class="icon-btn" id="saveBtn" type="button" title="Enregistrer" aria-label="Enregistrer">
      <span class="material-symbols-outlined">save</span>
    </button>
    <div class="sync-status" id="syncStatus">Chargement…</div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="summary">
  <div class="card">
    <h3 class="O" id="titleO">Séances de O</h3>
    <ul id="listO"></ul>
  </div>
  <div class="card">
    <h3 class="L" id="titleL">Séances de L</h3>
    <ul id="listL"></ul>
  </div>
</div>

<div class="week-summary">
  <h3>Planning final par jour</h3>
  <div class="week-cards" id="weekCards"></div>
</div>

<button class="drawer-backdrop" id="drawerBackdrop" type="button" hidden aria-label="Fermer les réglages"></button>
<aside class="drawer" id="settingsDrawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Réglages</h2>
    <button class="icon-btn ghost" id="closeSettingsBtn" type="button" title="Fermer" aria-label="Fermer">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <label class="drawer-field">
    Enfant 1
    <input type="text" id="kidNameO" maxlength="24" autocomplete="off" spellcheck="false">
  </label>
  <label class="drawer-field">
    Enfant 2
    <input type="text" id="kidNameL" maxlength="24" autocomplete="off" spellcheck="false">
  </label>
  <label class="drawer-field">
    Jeton GitHub
    <div class="token-row">
      <input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <button class="icon-btn danger" id="forgetTokenBtn" type="button" title="Oublier le jeton" aria-label="Oublier le jeton" hidden>
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
    <span style="font-weight:500;color:#6b6357;margin-top:4px;display:block;">Le jeton sert à écrire. Les autres appareils lisent le même planning sans jeton, après un enregistrement ici.</span>
  </label>
</aside>

<div id="editOverlay" class="modal-overlay" hidden>
  <div class="edit-dialog" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
  <div class="modal-head">
    <h2 id="editModalTitle">Modifier la séance</h2>
    <button class="icon-btn ghost" id="editCloseBtn" type="button" title="Fermer" aria-label="Fermer">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <form class="modal-form" id="editForm">
    <div class="modal-row">
      <label>Club
        <select id="editClub"></select>
      </label>
      <label>Sport
        <select id="editSport"></select>
      </label>
    </div>
    <div class="modal-row">
      <label>Jour
        <select id="editDay"></select>
      </label>
      <label>Optionnel
        <button class="opt-switch" id="editOptional" type="button" title="Séance optionnelle" aria-label="Séance optionnelle" aria-pressed="false">
          <span class="material-symbols-outlined">toggle_off</span>
        </button>
      </label>
    </div>
    <div class="modal-row">
      <label>Début
        <input id="editStart" type="time" step="300" required>
      </label>
      <label>Fin
        <input id="editEnd" type="time" step="300" required>
      </label>
    </div>
    <label>Activité
      <input id="editActivity" type="text" placeholder="Natation, BMX…" autocomplete="off">
    </label>
    <label>Enfants
      <div class="kid-row modal-kids">
        <button class="kid-btn" id="editKidO" type="button" data-kid="O" aria-pressed="false"></button>
        <button class="kid-btn" id="editKidL" type="button" data-kid="L" aria-pressed="false"></button>
      </div>
    </label>
    <label>Lieu
      <div class="addr-wrap">
        <input id="editLoc" type="text" placeholder="Rue, piscine, stade…" autocomplete="off" spellcheck="false">
        <div class="addr-hint" id="addrHint">Tape 3 lettres : adresses suisses (geo.admin.ch)</div>
        <ul class="addr-suggest" id="addrSuggest" hidden></ul>
      </div>
    </label>
    <div class="modal-actions">
      <button class="text-btn ghost" id="editIcsBtn" type="button">Calendrier .ics</button>
      <button class="text-btn ghost" id="editCancelBtn" type="button">Annuler</button>
      <button class="text-btn" type="submit">Enregistrer</button>
    </div>
  </form>
  </div>
</div>

<script>
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const KID_IDS = ["O","L"];
const CLUBS = [
  {id:"bmx", label:"BMX"},
  {id:"tri", label:"TriGenève"},
  {id:"stade", label:"Stade Genève"}
];
const SPORTS = [
  {id:"swim", label:"Natation", icon:"pool"},
  {id:"bike", label:"Vélo", icon:"directions_bike"},
  {id:"run", label:"Course", icon:"directions_run"}
];

function catalogEvents(){
  return [
    {id:"bmx1", day:"Lundi",    start:"17:45", end:"19:15", club:"bmx", sport:"bike", activity:"BMX", loc:""},
    {id:"bmx2", day:"Mercredi", start:"14:00", end:"16:00", club:"bmx", sport:"bike", activity:"BMX", loc:""},
    {id:"tcg-jtn-lun-nat", day:"Lundi",    start:"18:00", end:"19:00", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Les Vernets ou lac"},
    {id:"tcg-jtn-mar-cap", day:"Mardi",    start:"18:00", end:"19:30", club:"tri", sport:"run",  activity:"Course à pied Jeunes tous niveaux", loc:"Bout-du-monde"},
    {id:"tcg-jtn-mer-nat", day:"Mercredi", start:"14:00", end:"15:00", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Chandieu"},
    {id:"tcg-jtn-jeu-cap", day:"Jeudi",    start:"18:00", end:"19:30", club:"tri", sport:"run",  activity:"Course à pied Jeunes tous niveaux", loc:"Bout-du-monde"},
    {id:"tcg-jtn-sam-nat", day:"Samedi",   start:"11:00", end:"12:30", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Pâquis centre"}
  ];
}

function getToken(){
  return (document.getElementById("tokenInput")?.value || localStorage.getItem(TOKEN_KEY) || "").trim();
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function kidLabel(id){
  const n = (kidNames[id] || id).trim();
  return n || id;
}

function clubById(id){
  return CLUBS.find(c => c.id === id) || CLUBS[1];
}

function sportById(id){
  return SPORTS.find(s => s.id === id) || null;
}

function clubFromLegacy(type, club){
  if(club && CLUBS.some(c => c.id === club)) return club;
  if(type === "bmx") return "bmx";
  if(type === "athle") return "stade";
  return "tri";
}

function inferSport(activity, club){
  const a = (activity || "").toLowerCase();
  if(/natation|swim|aqua/.test(a)) return "swim";
  if(/vélo|velo|bike|bmx|powerwatt|vtt/.test(a)) return "bike";
  if(/course|athl|run|cap/.test(a)) return "run";
  if(club === "bmx") return "bike";
  if(club === "stade") return "run";
  return "";
}

function normalizeEvent(raw){
  const club = clubFromLegacy(raw.type, raw.club);
  const sport = sportById(raw.sport) ? raw.sport : inferSport(raw.activity, club);
  return {
    id: raw.id,
    day: raw.day,
    start: raw.start,
    end: raw.end,
    activity: raw.activity || "",
    loc: raw.loc || "",
    club,
    sport,
    verify: !!raw.verify,
    optional: raw.optional === true
  };
}

function optionsHtml(list, selected, includeBlank){

}

function loadLocalState(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch{
    return null;
  }
}

function persistLocal(data){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
  }catch(_){}
}

function snapshotState(updatedAt){
  flushEditFields();
  readKidNamesFromInputs();
  const compactAssignments = {};
  Object.entries(assignments).forEach(([id, a]) => {
    if(a && (a.O || a.L)) compactAssignments[id] = {O: !!a.O, L: !!a.L};
  });
  return {
    version: 2,
    updatedAt: updatedAt || new Date().toISOString(),
    assignments: compactAssignments,
    events: events.map(normalizeEvent),
    deletedIds: deletedIds.slice(),
    kidNames: {O: kidLabel("O"), L: kidLabel("L")}
  };
}

function touchLocal(){
  if(!plannerReady) return;
  persistLocal(snapshotState());
}

function newerState(a, b){
  if(!a) return b;
  if(!b) return a;
  return (a.updatedAt || "") >= (b.updatedAt || "") ? a : b;
}

function localIsAhead(local, remote){
  if(!local) return false;
  if(!remote) return true;
  return (local.updatedAt || "") > (remote.updatedAt || "");
}

function mergeEventLists(remoteEvents, localEvents, deleted){
  const byId = new Map();
  catalogEvents().forEach(e => byId.set(e.id, normalizeEvent(e)));
  (remoteEvents || []).forEach(e => {
    if(e && e.id) byId.set(e.id, normalizeEvent(e));
  });
  (localEvents || []).forEach(e => {
    if(e && e.id) byId.set(e.id, normalizeEvent(e));
  });
  deleted.forEach(id => byId.delete(id));
  catalogEvents().forEach(e => {
    if(!deleted.has(e.id) && !byId.has(e.id)) byId.set(e.id, normalizeEvent(e));
  });
  return [...byId.values()];
}

function mergePlannerData(remote, local){
  const useLocal = localIsAhead(local, remote);
  const primary = useLocal ? local : (remote || local || {});
  const deleted = new Set(Array.isArray(primary.deletedIds) ? primary.deletedIds : []);
  if(useLocal && Array.isArray(remote?.deletedIds)){
    remote.deletedIds.forEach(id => deleted.add(id));
  }
  const names = primary.kidNames && typeof primary.kidNames === "object" ? primary.kidNames : {};
  const assignments = primary.assignments && typeof primary.assignments === "object" ? primary.assignments : {};
  return {
    version: 2,
    updatedAt: primary.updatedAt || new Date().toISOString(),
    assignments,
    events: useLocal
      ? mergeEventLists(remote?.events, local?.events, deleted)
      : mergeEventLists(remote?.events || primary.events, null, deleted),
    deletedIds: [...deleted],
    kidNames: {
      O: (names.O || names.o || "O").toString().trim() || "O",
      L: (names.L || names.l || "L").toString().trim() || "L"
    }
  };
}

function setSyncStatus(kind, detail){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.classList.remove("local", "err");
  if(kind === "github"){
    el.textContent = "Partagé entre tes appareils";
    el.title = "Les autres appareils voient ce planning (GitHub).";
  }else if(kind === "local"){
    el.classList.add("local");
    el.textContent = "Sur cet appareil seulement";
    el.title = "Colle un jeton dans Réglages, puis Enregistrer, pour le voir ailleurs.";
  }else if(kind === "err"){
    el.classList.add("err");
    el.textContent = detail || "Sync impossible";
    el.title = detail || "";
  }else{
    el.textContent = detail || "";
    el.title = "";
  }
}

function scheduleSave(immediate){
  touchLocal();
  if(!plannerReady) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { autoSave(); }, immediate ? 200 : 800);
}

async function autoSave(){
  if(!plannerReady) return;
  if(!getToken()){
    setSyncStatus("local");
    return;
  }
  if(saveInFlight){
    saveQueued = true;
    return;
  }
  saveInFlight = true;
  try{
    await saveRemoteState();
    markSave(true);
    setSyncStatus("github");
  }catch(err){
    markSave(false, err.message || String(err));
    setSyncStatus("err", err.message || String(err));
  }finally{
    saveInFlight = false;
    if(saveQueued){
      saveQueued = false;
      scheduleSave(true);
    }
  }
}

function encodeBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function decodeBase64(b64){
  const bin = atob(b64.replace(/\n/g, ""));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function githubHeaders(withAuth){
  const headers = {
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  const token = getToken();
  if(withAuth && token) headers.Authorization = "Bearer " + token;
  return headers;
}

function serializeState(){
  const data = snapshotState();
  persistLocal(data);
  return data;
}

function applyState(data){
  if(!data) return;
  assignments = data.assignments && typeof data.assignments === "object" ? data.assignments : {};
  deletedIds = Array.isArray(data.deletedIds) ? data.deletedIds.slice() : [];
  if(data.kidNames && typeof data.kidNames === "object"){
    kidNames = {
      O: (data.kidNames.O || data.kidNames.o || kidNames.O || "O").toString().trim() || "O",
      L: (data.kidNames.L || data.kidNames.l || kidNames.L || "L").toString().trim() || "L"
    };
  }
  const deleted = new Set(deletedIds);
  if(Array.isArray(data.events) && data.events.length){
    events = mergeEventLists(data.events, null, deleted);
  }else{
    const byId = new Map(defaultEvents().map(e => [e.id, e]));
    const hidden = new Set(Array.isArray(data.hiddenIds) ? data.hiddenIds : []);
    deleted.forEach(id => hidden.add(id));
    if(data.eventPatches && typeof data.eventPatches === "object"){
      Object.entries(data.eventPatches).forEach(([id, p]) => {
        const base = byId.get(id) || {id};
        byId.set(id, normalizeEvent({...base, ...p}));
      });
    }
    if(Array.isArray(data.customEvents)){
      data.customEvents.forEach(e => byId.set(e.id, normalizeEvent(e)));
    }
    catalogEvents().forEach(e => {
      if(!hidden.has(e.id) && !byId.has(e.id)) byId.set(e.id, normalizeEvent(e));
    });
    events = [...byId.values()].filter(e => !hidden.has(e.id));
  }
  fillKidNameInputs();
}

async function fetchRemoteJsonFile(){
  const res = await fetch(
    `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${encodeURIComponent(GH_BRANCH)}/${GH_DATA_PATH}?t=${Date.now()}`,
    { cache: "no-store" }
  );
  if(!res.ok) return null;
  return res.json();
}

async function fetchRemoteState(){
  const res = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(GH_DATA_PATH)}?ref=${encodeURIComponent(GH_BRANCH)}&t=${Date.now()}`,
    {
      cache: "no-store",
      headers: {
        ...githubHeaders(true),
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    }
  );
  if(res.status === 404) return { sha: null, data: null };
  if(!res.ok){
    const fallback = await fetchRemoteJsonFile();
    if(fallback) return { sha: null, data: fallback };
    const body = await res.text();
    throw new Error(`Lecture GitHub ${res.status}: ${body}`);
  }
  const json = await res.json();
  const text = decodeBase64(json.content || "");
  fileSha = json.sha || null;
  return { sha: json.sha, data: text ? JSON.parse(text) : null };
}

async function saveRemoteState(){
  const token = getToken();
  if(!token){
    throw new Error("Colle un jeton GitHub avec Contents: Read and write, puis réessaie.");
  }
  localStorage.setItem(TOKEN_KEY, token);

  const payload = JSON.stringify(serializeState(), null, 2) + "\n";
  const content = encodeBase64(payload);

  async function put(sha){
    const body = {
      message: "Update planner assignments",
      content,
      branch: GH_BRANCH
    };
    if(sha) body.sha = sha;
    return fetch(
      `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(GH_DATA_PATH)}`,
      {
        method: "PUT",
        cache: "no-store",
        headers: { ...githubHeaders(true), "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }
    );
  }

  if(!fileSha){
    ({ sha: fileSha } = await fetchRemoteState());
  }
  let res = await put(fileSha);
  if(res.status === 409){
    ({ sha: fileSha } = await fetchRemoteState());
    res = await put(fileSha);
  }
  if(res.status === 401 || res.status === 403){
    throw new Error("Jeton refusé. Vérifie qu'il a Contents: Read and write sur infinitethinking/kids.");
  }
  if(!res.ok){
    const body = await res.text();
    throw new Error(`Enregistrement ${res.status}: ${body}`);
  }
  try{
    const json = await res.json();
    if(json.content?.sha) fileSha = json.content.sha;
  }catch(_){}
}

function toMinutes(t){
  const [h,m] = t.split(":").map(Number);
  return h*60+m;
}

function findEvent(id){
  return events.find(e => e.id === id);
}

function getAssign(id){
  if(!assignments[id]) assignments[id] = {O:false, L:false};
  return assignments[id];
}

function overlaps(a,b){
  return a.day === b.day && toMinutes(a.start) < toMinutes(b.end) && toMinutes(b.start) < toMinutes(a.end);
}

function conflictsFor(ev, kid){
  return events.some(other => other.id !== ev.id
      && getAssign(other.id)[kid]
      && overlaps(ev, other));
}

const SCHOOL_YEAR_START = "2026-08-17";
const SCHOOL_YEAR_END = "2027-07-05";
const ICS_UNTIL_UTC = "20270704T220000Z";
const DAY_TO_BYDAY = {Lundi:"MO",Mardi:"TU",Mercredi:"WE",Jeudi:"TH",Vendredi:"FR",Samedi:"SA"};
const DAY_TO_UTC_WEEKDAY = {Lundi:1,Mardi:2,Mercredi:3,Jeudi:4,Vendredi:5,Samedi:6};
const HOLIDAY_PERIODS = [
  ["2026-10-19","2026-10-23"],
  ["2026-12-24","2027-01-08"],
  ["2027-02-15","2027-02-19"],
  ["2027-03-26","2027-04-09"],
  ["2027-05-06","2027-05-07"]
];
const HOLIDAY_DAYS = ["2026-09-10","2027-05-17"];

function pad2(n){
  return String(n).padStart(2,"0");
}

function isoFromUtcMs(ms){
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
}

function utcMs(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return Date.UTC(y, m-1, d);
}

function addDaysIso(iso, n){
  return isoFromUtcMs(utcMs(iso) + n*86400000);
}

function utcWeekday(iso){
  return new Date(utcMs(iso)).getUTCDay();
}

function expandToSaturday(endIso){
  const w = utcWeekday(endIso);
  if(w === 0 || w === 6) return endIso;
  return addDaysIso(endIso, 6 - w);
}

function eachIsoInclusive(start, end){
  const out = [];
  for(let d = start; d <= end; d = addDaysIso(d, 1)) out.push(d);
  return out;
}

const HOLIDAY_SET = (()=>{
  const set = new Set(HOLIDAY_DAYS);
  HOLIDAY_PERIODS.forEach(([start, end])=>{
    eachIsoInclusive(start, expandToSaturday(end)).forEach(d => set.add(d));
  });
  return set;
})();

function weeklyDates(weekday, startIso, endExclusive){
  let d = startIso;
  while(utcWeekday(d) !== weekday) d = addDaysIso(d, 1);
  const out = [];
  while(d < endExclusive){
    out.push(d);
    d = addDaysIso(d, 7);
  }
  return out;
}

function icsDateTime(isoDate, hm){
  const [h, m] = (hm || "00:00").split(":");
  return isoDate.replace(/-/g,"") + "T" + pad2(Number(h)) + pad2(Number(m)) + "00";
}

function icsEscape(value){
  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/\n/g,"\\n")
    .replace(/;/g,"\\;")
    .replace(/,/g,"\\,");
}

function icsFold(line){
  const parts = [];
  while(line.length > 75){
    parts.push(line.slice(0,75));
    line = " " + line.slice(75);
  }
  parts.push(line);
  return parts.join("\r\n");
}

function eventSummary(ev){
  const a = getAssign(ev.id);
  const names = KID_IDS.filter(k => a[k]).map(kidLabel);
  const sport = sportById(ev.sport);
  const sportLabel = sport ? sport.label : (ev.activity || "Séance");
  if(names.length === 1) return `${names[0]} | ${sportLabel}`;
  if(names.length > 1) return `${names.join(" & ")} | ${sportLabel}`;
  return ev.activity || sportLabel;
}

function icsFilename(ev){
  const slug = (ev.activity || "seance")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .slice(0,40);
  return `${slug || "seance"}-${ev.day}.ics`;
}

function buildIcs(ev){
  const weekday = DAY_TO_UTC_WEEKDAY[ev.day];
  const byday = DAY_TO_BYDAY[ev.day];
  if(weekday == null || !byday) return "";
  const dates = weeklyDates(weekday, SCHOOL_YEAR_START, SCHOOL_YEAR_END);
  const kept = dates.filter(d => !HOLIDAY_SET.has(d));
  if(!kept.length) return "";
  const first = kept[0];
  const skipped = dates.filter(d => HOLIDAY_SET.has(d) && d > first);
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//infinitethinking//kids planner//FR",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VTIMEZONE",
    "TZID:Europe/Zurich",
    "BEGIN:DAYLIGHT",
    "TZOFFSETFROM:+0100",
    "TZOFFSETTO:+0200",
    "TZNAME:CEST",
    "DTSTART:19700329T020000",
    "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU",
    "END:DAYLIGHT",
    "BEGIN:STANDARD",
    "TZOFFSETFROM:+0200",
    "TZOFFSETTO:+0100",
    "TZNAME:CET",
    "DTSTART:19701025T030000",
    "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU",
    "END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT",
    `UID:kids-${ev.id}@infinitethinking.github.io`,
    `DTSTAMP:${stamp}`,
    `DTSTART;TZID=Europe/Zurich:${icsDateTime(first, ev.start)}`,
    `DTEND;TZID=Europe/Zurich:${icsDateTime(first, ev.end)}`,
    `RRULE:FREQ=WEEKLY;BYDAY=${byday};UNTIL=${ICS_UNTIL_UTC}`,
    icsFold("SUMMARY:" + icsEscape(eventSummary(ev)))
  ];
  if(ev.loc) lines.push(icsFold("LOCATION:" + icsEscape(ev.loc)));
  const club = clubById(ev.club);
  const sport = sportById(ev.sport);
  const desc = [club.label, sport ? sport.label : ""].filter(Boolean).join(" · ");
  if(desc) lines.push(icsFold("DESCRIPTION:" + icsEscape(desc)));
  skipped.forEach(d => {
    lines.push(`EXDATE;TZID=Europe/Zurich:${icsDateTime(d, ev.start)}`);
  });
  lines.push("END:VEVENT", "END:VCALENDAR", "");
  return lines.join("\r\n");
}

function downloadIcs(ev){
  let text = "";
  try{
    text = buildIcs(ev);
  }catch(err){
    console.error(err);
    markSave(false, err.message || "Impossible de créer le calendrier");
    return;
  }
  if(!text){
    markSave(false, "Pas de dates pour cette séance sur 2026–2027");
    return;
  }
  const filename = icsFilename(ev);
  const blob = new Blob([text], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true, view:window}));
  setTimeout(() => {
    a.remove();
    URL.revokeObjectURL(url);
  }, 2500);
}

function render(){
  flushEditFields();
  updateKidChrome();
  const grid = document.getElementById('grid');
  grid.innerHTML = "";

    const col = document.createElement('div');
    col.className = 'day-col';
    col.dataset.day = day;
    const dayEvents = events.filter(e=>e.day===day).sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));

    let html = `<div class="day-col-head">
      <h2>${day}</h2>

      </button>
    </div>`;
    if(dayEvents.length===0){
      html += `<div class="empty">—</div>`;
    }
    col.innerHTML = html;

    dayEvents.forEach(ev=>{
      const a = getAssign(ev.id);
      const oName = kidLabel("O");
      const lName = kidLabel("L");

      const cL = a.L && conflictsFor(ev,'L');
      const club = clubById(ev.club);
      const div = document.createElement('div');
      div.className = `event club-${club.id}` + (ev.optional ? ' optional' : '') + ((cO||cL) ? ' conflict' : '');
      div.dataset.id = ev.id;
      div.draggable = true;
      div.title = "Glisse vers un autre jour, ou double-clique pour modifier";
      div.innerHTML = `
        <div class="card-actions">
          <button class="icon-btn" data-ics="${ev.id}" type="button" title="Télécharger le calendrier" aria-label="Télécharger le calendrier">
            <span class="material-symbols-outlined">calendar_month</span>
          </button>
          <button class="icon-btn" data-edit="${ev.id}" type="button" title="Modifier" aria-label="Modifier">
            <span class="material-symbols-outlined">edit</span>
          </button>
          <button class="icon-btn del-btn" data-del="${ev.id}" type="button" title="Supprimer cette séance" aria-label="Supprimer cette séance">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
        <div class="event-head">
          ${sportIconHtml(ev.sport)}
          <div class="time">${ev.start}–${ev.end}</div>
        </div>
        <div class="activity">${esc(ev.activity)}</div>
        ${ev.loc ? `<div class="loc">${esc(ev.loc)}</div>` : ''}
        ${ev.verify ? `<div class="conflict-flag"><span class="material-symbols-outlined">warning</span>jour/heure à vérifier</div>` : ''}
        ${(cO||cL) ? `<div class="conflict-flag"><span class="material-symbols-outlined">warning</span>chevauchement pour ${cO?esc(oName):''}${cO&&cL?' & ':''}${cL?esc(lName):''}</div>` : ''}
        <div class="kid-row">
          <button class="kid-btn ${a.O?'on-O':''}" data-kid="O" data-id="${ev.id}">${esc(oName)}</button>
          <button class="kid-btn ${a.L?'on-L':''}" data-kid="L" data-id="${ev.id}">${esc(lName)}</button>

      col.appendChild(div);
    });

    grid.appendChild(col);
  });

  renderSummary();

function renderWeekCards(){
  const container = document.getElementById('weekCards');
  const daysWithSelection = DAYS.filter(day =>
    events.some(e => e.day === day && (getAssign(e.id).O || getAssign(e.id).L))
  );

  if(daysWithSelection.length === 0){
    container.innerHTML = `<div class="empty">Aucune séance sélectionnée pour l'instant.</div>`;
    return;
  }

  container.innerHTML = daysWithSelection.map(day=>{
    const items = events.filter(e => e.day === day && (getAssign(e.id).O || getAssign(e.id).L))
      .sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
    const itemsHtml = items.map(e=>{
      const a = getAssign(e.id);
      const chips = KID_IDS.filter(k=>a[k]).map(k=>`<span class="kid-chip ${k}">${esc(kidLabel(k))}</span>`).join('');
      const sport = sportById(e.sport);
      return `
        <div class="day-summary-item club-${clubById(e.club).id}">
          <div class="t">${sport ? `<span class="material-symbols-outlined">${sport.icon}</span>` : ''}${e.start}–${e.end}</div>
          <div class="a">${esc(e.activity)}${e.loc ? ' — '+esc(e.loc) : ''}</div>
          <div class="kids">${chips}</div>
        </div>
      `;
    }).join('');
    return `<div class="day-summary-card"><h4>${day}</h4>${itemsHtml}</div>`;
  }).join('');
}

function renderSummary(){
  KID_IDS.forEach(kid=>{
    const list = document.getElementById('list'+kid);
    const items = events.filter(e=>getAssign(e.id)[kid])
      .sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || toMinutes(a.start)-toMinutes(b.start));
    if(items.length===0){
      list.innerHTML = `<li class="empty" style="list-style:none;margin-left:-18px;">Aucune séance assignée.</li>`;
      return;
    }
    list.innerHTML = items.map(e=>{
      const conf = conflictsFor(e,kid);
      const sport = sportById(e.sport);
      return `<li class="${conf?'conflict-item':''}">${conf?'<span class="material-symbols-outlined">warning</span> ':''}${sport?'<span class="material-symbols-outlined">'+sport.icon+'</span> ':''}${e.day} ${e.start}–${e.end} — ${esc(e.activity)}${e.loc? ' ('+esc(e.loc)+')':''}</li>`;
    }).join('');
  });
}

function bindGridOnce(){
  const grid = document.getElementById("grid");
  grid.addEventListener("click", onGridClick);
  grid.addEventListener("dblclick", onGridDblClick);
  grid.addEventListener("dragstart", onCardDragStart);
  grid.addEventListener("dragend", onCardDragEnd);
  grid.addEventListener("dragover", onCardDragOver);
  grid.addEventListener("dragleave", onCardDragLeave);
  grid.addEventListener("drop", onCardDrop);
}

let dragEventId = null;
let draggedThisGesture = false;

function clearDropTargets(){
  document.querySelectorAll(".day-col.drop-target").forEach(col => col.classList.remove("drop-target"));
}

function onCardDragStart(e){
  const t = e.target;
  if(!(t instanceof Element)) return;
  if(t.closest("button, a, input, select, textarea")){
    e.preventDefault();
    return;
  }
  const card = t.closest(".event");
  if(!card || !e.dataTransfer){
    e.preventDefault();
    return;
  }
  dragEventId = card.getAttribute("data-id");
  draggedThisGesture = false;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragEventId || "");
  card.classList.add("dragging");
}

function onCardDragEnd(){
  clearDropTargets();
  document.querySelectorAll(".event.dragging").forEach(card => card.classList.remove("dragging"));
  setTimeout(() => {
    draggedThisGesture = false;
    dragEventId = null;
  }, 0);
}

function onCardDragOver(e){
  const col = e.target instanceof Element ? e.target.closest(".day-col") : null;
  if(!col || !dragEventId) return;
  e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
  if(!col.classList.contains("drop-target")){
    clearDropTargets();
    col.classList.add("drop-target");
  }
}

function onCardDragLeave(e){
  const col = e.target instanceof Element ? e.target.closest(".day-col") : null;
  if(!col) return;
  const next = e.relatedTarget instanceof Element ? e.relatedTarget : null;
  if(next && col.contains(next)) return;
  col.classList.remove("drop-target");
}

function onCardDrop(e){
  const col = e.target instanceof Element ? e.target.closest(".day-col") : null;
  if(!col) return;
  e.preventDefault();
  const day = col.getAttribute("data-day");
  const id = dragEventId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
  const ev = findEvent(id);
  clearDropTargets();
  if(!ev || !day) return;
  draggedThisGesture = true;
  if(ev.day === day) return;
  ev.day = day;
  scheduleSave(true);
  render();
}

function onGridClick(e){
  const t = e.target;
  if(!(t instanceof Element)) return;
  const add = t.closest("[data-add-day]");
  if(add){
    addSession(add.getAttribute("data-add-day"));
    return;
  }
  const edit = t.closest("[data-edit]");
  if(edit){
    e.preventDefault();
    e.stopPropagation();
    openEditModal(edit.getAttribute("data-edit"));
    return;
  }
  const del = t.closest("[data-del]");
  if(del){
    e.preventDefault();
    e.stopPropagation();
    const id = del.getAttribute("data-del");
    events = events.filter(ev => ev.id !== id);
    delete assignments[id];
    if(!deletedIds.includes(id)) deletedIds.push(id);
    if(editingId === id) closeEditModal(false);
    scheduleSave(true);
    render();
    return;
  }
  const ics = t.closest("[data-ics]");
  if(ics){
    e.preventDefault();
    e.stopPropagation();
    const ev = findEvent(ics.getAttribute("data-ics"));
    if(ev) downloadIcs(ev);
    return;
  }
  const kid = t.closest(".kid-btn");
  if(kid){
    e.preventDefault();
    e.stopPropagation();
    const id = kid.getAttribute("data-id");
    const which = kid.getAttribute("data-kid");
    const a = getAssign(id);
    a[which] = !a[which];
    scheduleSave();
    render();
  }
}

function onGridDblClick(e){
  if(draggedThisGesture) return;
  const t = e.target;
  if(!(t instanceof Element)) return;
  if(t.closest(".kid-btn, .card-actions, [data-add-day]")) return;
  const card = t.closest(".event");
  if(card) openEditModal(card.getAttribute("data-id"));
}

function setOptionalToggle(on){
  const btn = document.getElementById("editOptional");

}

function setModalKid(kid, on){

  btn.textContent = kidLabel(kid);
  btn.setAttribute("aria-pressed", on ? "true" : "false");

  btn.classList.toggle("on-L", kid === "L" && on);

function fillModalKids(id){

  document.getElementById("editClub").innerHTML = optionsHtml(CLUBS, "", false);
  document.getElementById("editSport").innerHTML = optionsHtml(SPORTS, "", true);

function toHm(value, fallback){
  const m = String(value || "").match(/^(\d{1,2}):(\d{2})/);
  if(!m) return fallback || "18:00";
  return String(m[1]).padStart(2,"0") + ":" + m[2];
}

function isEditOpen(){
  const overlay = document.getElementById("editOverlay");
  return overlay && !overlay.hidden;
}

function openEditModal(id){
  const ev = findEvent(id);
  if(!ev) return;
  editingId = id;
  hideAddrSuggest();
  fillEditSelects();
  document.getElementById("editClub").value = ev.club || "tri";
  document.getElementById("editSport").value = ev.sport || "";
  document.getElementById("editDay").value = ev.day;
  document.getElementById("editStart").value = toHm(ev.start, "18:00");
  document.getElementById("editEnd").value = toHm(ev.end, "19:00");
  document.getElementById("editActivity").value = ev.activity === "Nouvelle séance" ? "" : (ev.activity || "");
  document.getElementById("editLoc").value = ev.loc || "";
  document.getElementById("addrHint").textContent = "Tape 3 lettres : adresses suisses (geo.admin.ch)";
  setOptionalToggle(ev.optional === true);
  fillModalKids(id);
  document.getElementById("editModalTitle").textContent = isNewEvent ? "Nouvelle séance" : "Modifier la séance";
  const overlay = document.getElementById("editOverlay");
  overlay.hidden = false;
  overlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  const activity = document.getElementById("editActivity");
  setTimeout(() => {
    activity.focus();
    activity.select();
  }, 30);
}

function closeEditModal(save){
  if(save) applyModalToEvent();
  else if(isNewEvent && editingId){
    events = events.filter(e => e.id !== editingId);
  }
  hideAddrSuggest();
  const overlay = document.getElementById("editOverlay");
  overlay.hidden = true;
  overlay.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  editingId = null;
  isNewEvent = false;
  if(save) scheduleSave(true);
  render();
}

function applyModalToEvent(){
  const ev = findEvent(editingId);
  if(!ev) return;
  ev.club = document.getElementById("editClub").value;
  ev.sport = document.getElementById("editSport").value;
  ev.day = document.getElementById("editDay").value;
  ev.start = toHm(document.getElementById("editStart").value, ev.start);
  ev.end = toHm(document.getElementById("editEnd").value, ev.end);
  ev.activity = document.getElementById("editActivity").value.trim() || "Séance";
  ev.loc = document.getElementById("editLoc").value.trim();
  ev.optional = document.getElementById("editOptional").getAttribute("aria-pressed") === "true";
  const a = getAssign(ev.id);
  a.O = document.getElementById("editKidO").getAttribute("aria-pressed") === "true";
  a.L = document.getElementById("editKidL").getAttribute("aria-pressed") === "true";
}

function stripHtml(html){
  return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function hideAddrSuggest(){
  const box = document.getElementById("addrSuggest");
  if(!box) return;
  box.hidden = true;
  box.innerHTML = "";
}

let addrTimer = null;
let addrReq = 0;

async function searchSwissAddress(query){
  const q = query.trim();
  const hint = document.getElementById("addrHint");
  if(q.length < 3){
    hideAddrSuggest();
    if(hint) hint.textContent = "Tape 3 lettres : adresses suisses (geo.admin.ch)";
    return;
  }
  const n = ++addrReq;
  if(hint) hint.textContent = "Recherche…";
  try{
    const params = new URLSearchParams({
      searchText: q,
      type: "locations",
      origins: "address,gg25,gazetteer",
      limit: "8",
      lang: "fr"
    });
    const res = await fetch("https://api3.geo.admin.ch/rest/services/api/SearchServer?" + params.toString());
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(n !== addrReq) return;
    const rows = Array.isArray(data.results) ? data.results : [];
    const box = document.getElementById("addrSuggest");
    box.innerHTML = "";
    const seen = new Set();
    const ranked = rows.slice().sort((a,b)=>{
      const la = String((a.attrs||{}).label || (a.attrs||{}).detail || "");
      const lb = String((b.attrs||{}).label || (b.attrs||{}).detail || "");
      const ga = /ge|genève|geneve/i.test(la) ? 0 : 1;
      const gb = /ge|genève|geneve/i.test(lb) ? 0 : 1;
      return ga - gb;
    });
    ranked.forEach(row => {
      const attrs = row.attrs || {};
      const label = stripHtml(attrs.label || attrs.detail || "");
      if(!label || seen.has(label.toLowerCase())) return;
      seen.add(label.toLowerCase());
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      btn.addEventListener("mousedown", (e)=> e.preventDefault());
      btn.addEventListener("click", ()=>{
        document.getElementById("editLoc").value = label;
        hideAddrSuggest();
        if(hint) hint.textContent = "Adresse sélectionnée";
        document.getElementById("editLoc").focus();
      });
      li.appendChild(btn);
      box.appendChild(li);
    });
    box.hidden = box.childElementCount === 0;
    if(hint) hint.textContent = box.childElementCount ? `${box.childElementCount} lieu(x)` : "Aucun lieu trouvé — tu peux taper librement";
  }catch(_){
    if(n === addrReq){
      hideAddrSuggest();
      if(hint) hint.textContent = "Recherche indisponible — tape le lieu à la main";
    }
  }
}

function addSession(day){
  const id = "custom_" + Date.now();
  deletedIds = deletedIds.filter(x => x !== id);
  isNewEvent = true;
  events.push({
    id, day, start:"18:00", end:"19:00",
    club:"tri", sport:"swim", activity:"", loc:"", optional:false
  });
  openEditModal(id);
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('saveBtn');
  if(!plannerReady){
    markSave(false, "Chargement en cours, réessaie dans un instant.");
    return;
  }
  btn.disabled = true;
  try{
    await saveRemoteState();
    markSave(true);
    setSyncStatus("github");
  }catch(err){
    markSave(false, err.message || String(err));
    setSyncStatus("err", err.message || String(err));
  }finally{
    btn.disabled = false;
  }
});

(async function init(){
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  let restoredCatalog = false;
  try{
    let remote = null;
    try{
      const fetched = await fetchRemoteState();
      remote = fetched.data;
    }catch(err){
      markSave(false, err.message || String(err));
    }
    const local = loadLocalState();
    const merged = mergePlannerData(remote, local);
    applyState(merged);
    readKidNamesFromInputs();
    fillKidNameInputs();
    persistLocal(snapshotState(merged.updatedAt));
    const remoteIds = new Set((remote?.events || []).map(e => e.id));
    restoredCatalog = catalogEvents().some(e => !remoteIds.has(e.id) && !deletedIds.includes(e.id));
    if(localIsAhead(local, remote)) setSyncStatus("local");
    else if(remote) setSyncStatus("github");
    else setSyncStatus("local");
  }finally{
    plannerReady = true;
    saveBtn.disabled = false;
    render();
    if(restoredCatalog) scheduleSave(true);
  }
})();
</script>
