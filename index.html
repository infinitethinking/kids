<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Planning entraînements — O & L</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0">
<style>
  .material-symbols-outlined{
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    font-size:20px;
    line-height:1;
    user-select:none;
  }
  :root{
    --ink:#1b2430;
    --paper:#f6f4ee;
    --line:#d9d3c4;
    --tri:#1f6f8b;      /* TriGenève */
    --tri-bg:#e4f0f3;
    --bmx:#c0522d;      /* BMX */
    --bmx-bg:#f7e6dc;
    --stade:#5a7a3a;    /* Stade Genève */
    --stade-bg:#e9f0e1;
    --o-color:#a7351e;  /* kid O tag */
    --l-color:#1e4f9e;  /* kid L tag */
    --warn:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 20px 60px;
  }
  h1{
    font-size:22px;
    letter-spacing:0.3px;
    margin:0 0 4px;
    font-weight:700;
  }
  .sub{
    font-size:13px;
    color:#6b6357;
    margin-bottom:18px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
  }
  .legend{
    display:flex;
    gap:14px;
    font-size:12px;
    margin-left:auto;
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;}

  .icon-btn{
    width:36px;
    height:36px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-btn:hover{opacity:0.85;}
  .icon-btn:disabled{opacity:0.5;cursor:wait;}
  .icon-btn.ghost{
    background:#fff;
    color:var(--ink);
  }
  .icon-btn.danger{
    background:#fff;
    color:var(--warn);
    border-color:var(--warn);
  }
  .icon-btn.ok .material-symbols-outlined{
    font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
  }
  .icon-btn.err{
    background:var(--warn);
    border-color:var(--warn);
    color:#fff;
  }
  .icon-btn.open{
    background:var(--ink);
    color:var(--paper);
  }

  .save-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }

  .drawer-backdrop{
    position:fixed;
    inset:0;
    background:rgba(27,36,48,0.35);
    z-index:40;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .drawer-backdrop[hidden]{display:none;}
  .drawer{
    position:fixed;
    top:0;
    right:0;
    width:min(360px,100%);
    height:100%;
    background:var(--paper);
    z-index:50;
    transform:translateX(100%);
    transition:transform 0.2s ease;
    box-shadow:-8px 0 24px rgba(27,36,48,0.16);
    padding:18px 18px 32px;
    overflow:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .drawer-head h2{
    margin:0;
    font-size:16px;
  }
  .drawer-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:16px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
  }
  .drawer-field input{
    font-size:14px;
    font-weight:500;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .token-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .token-row input{flex:1;min-width:0;}
  .card-actions{
    position:absolute;
    top:2px;
    right:2px;
    display:flex;
    gap:0;
  }
  .card-actions .icon-btn{
    width:24px;
    height:24px;
    border:none;
    background:transparent;
    color:#8a8271;
    border-radius:4px;
  }
  .card-actions .icon-btn .material-symbols-outlined{font-size:18px;}
  .card-actions .del-btn{color:var(--warn);}
  .conflict-flag .material-symbols-outlined{
    font-size:15px;
    vertical-align:-3px;
    margin-right:2px;
  }
  .conflict-item .material-symbols-outlined{
    font-size:15px;
    vertical-align:-3px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
  }
  .day-col{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    min-height:120px;
  }
  .day-col h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  .event{
    border-radius:8px;
    padding:8px 9px 9px;
    margin-bottom:8px;
    font-size:12px;
    border:1px solid transparent;
    position:relative;
  }
  .event.club-tri{background:var(--tri-bg);border-color:#bcd9e0;}
  .event.club-bmx{background:var(--bmx-bg);border-color:#e3bda6;}
  .event.club-stade{background:var(--stade-bg);border-color:#c6d8b4;}

  .event-head{
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding-right:72px;
  }
  .sport-icon{
    font-size:18px;
    line-height:1;
    margin-top:1px;
  }
  .event.club-tri .sport-icon{color:var(--tri);}
  .event.club-bmx .sport-icon{color:var(--bmx);}
  .event.club-stade .sport-icon{color:var(--stade);}
  .event-head .time{flex:1;}

  .event .time{
    font-weight:700;
    font-size:12px;
  }
  .event .activity{
    font-weight:700;
    margin-top:1px;
  }
  .event .loc{
    color:#5c564a;
    font-size:11px;
    margin-top:1px;
  }
  .event.conflict{
    outline:2px solid var(--warn);
    outline-offset:1px;
  }
  .conflict-flag{
    color:var(--warn);
    font-size:10.5px;
    font-weight:700;
    margin-top:4px;
  }

  .kid-row{
    display:flex;
    gap:6px;
    margin-top:7px;
  }
  .kid-btn{
    flex:1;
    border-radius:6px;
    border:1px solid #b9b2a1;
    background:#fff;
    padding:4px 6px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    color:#8a8271;
    min-width:0;
  }
  .kid-btn.on-O{background:var(--o-color);border-color:var(--o-color);color:#fff;}
  .kid-btn.on-L{background:var(--l-color);border-color:var(--l-color);color:#fff;}

  .edit-fields{
    margin-top:6px;
    display:none;
    gap:5px;
    flex-direction:column;
  }
  .edit-fields.show{display:flex;}
  .edit-fields input, .edit-fields select{
    font-size:11px;
    padding:3px 5px;
    border:1px solid #c9c2b0;
    border-radius:4px;
    width:100%;
  }

  .summary{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .summary .card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .summary h3{
    margin:0 0 8px;
    font-size:14px;
  }
  .summary h3.O{color:var(--o-color);}
  .summary h3.L{color:var(--l-color);}
  .summary ul{
    margin:0;
    padding-left:18px;
    font-size:12.5px;
    line-height:1.6;
  }
  .summary li .material-symbols-outlined{
    font-size:15px;
    vertical-align:-3px;
  }
  .empty{color:#8a8271;font-size:12.5px;}

  .week-summary{margin-top:30px;}
  .week-summary h3{font-size:14px;margin:0 0 12px;}
  .week-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
  }
  .day-summary-card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .day-summary-card h4{
    margin:0 0 8px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .day-summary-item{
    font-size:12.5px;
    margin-bottom:9px;
    padding-left:8px;
    border-left:3px solid var(--tri);
  }
  .day-summary-item.club-tri{border-left-color:var(--tri);}
  .day-summary-item.club-bmx{border-left-color:var(--bmx);}
  .day-summary-item.club-stade{border-left-color:var(--stade);}
  .day-summary-item .t{
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .day-summary-item .t .material-symbols-outlined{font-size:16px;}
  .day-summary-item .a{margin-top:1px;}
  .day-summary-item .kids{margin-top:3px;display:flex;gap:5px;}
  .kid-chip{
    font-size:10.5px;
    font-weight:700;
    padding:1px 7px;
    border-radius:999px;
    color:#fff;
  }
  .kid-chip.O{background:var(--o-color);}
  .kid-chip.L{background:var(--l-color);}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .summary{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<h1 id="pageTitle">Planning hebdomadaire — O &amp; L</h1>
<div class="sub" id="pageSub">Clique sur un enfant pour l'assigner à une séance. Utilise l'icône modifier pour le club, le sport, le jour ou l'horaire.</div>

<div class="toolbar">
  <button class="icon-btn" id="addEventBtn" type="button" title="Ajouter une séance" aria-label="Ajouter une séance">
    <span class="material-symbols-outlined">calendar_add_on</span>
  </button>
  <div class="save-bar">
    <button class="icon-btn ghost" id="settingsBtn" type="button" title="Réglages" aria-label="Réglages" aria-expanded="false" aria-controls="settingsDrawer">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <button class="icon-btn" id="saveBtn" type="button" title="Enregistrer" aria-label="Enregistrer">
      <span class="material-symbols-outlined">save</span>
    </button>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:var(--bmx)"></i>BMX</span>
    <span><i class="swatch" style="background:var(--tri)"></i>TriGenève</span>
    <span><i class="swatch" style="background:var(--stade)"></i>Stade Genève</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="summary">
  <div class="card">
    <h3 class="O" id="titleO">Séances de O</h3>
    <ul id="listO"></ul>
  </div>
  <div class="card">
    <h3 class="L" id="titleL">Séances de L</h3>
    <ul id="listL"></ul>
  </div>
</div>

<div class="week-summary">
  <h3>Planning final par jour</h3>
  <div class="week-cards" id="weekCards"></div>
</div>

<button class="drawer-backdrop" id="drawerBackdrop" type="button" hidden aria-label="Fermer les réglages"></button>
<aside class="drawer" id="settingsDrawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Réglages</h2>
    <button class="icon-btn ghost" id="closeSettingsBtn" type="button" title="Fermer" aria-label="Fermer">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <label class="drawer-field">
    Enfant 1
    <input type="text" id="kidNameO" maxlength="24" autocomplete="off" spellcheck="false">
  </label>
  <label class="drawer-field">
    Enfant 2
    <input type="text" id="kidNameL" maxlength="24" autocomplete="off" spellcheck="false">
  </label>
  <label class="drawer-field">
    Jeton GitHub
    <div class="token-row">
      <input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <button class="icon-btn danger" id="forgetTokenBtn" type="button" title="Oublier le jeton" aria-label="Oublier le jeton" hidden>
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
  </label>
</aside>

<script>
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const KID_IDS = ["O","L"];
const CLUBS = [
  {id:"bmx", label:"BMX"},
  {id:"tri", label:"TriGenève"},
  {id:"stade", label:"Stade Genève"}
];
const SPORTS = [
  {id:"swim", label:"Natation", icon:"pool"},
  {id:"bike", label:"Vélo", icon:"directions_bike"},
  {id:"run", label:"Course", icon:"directions_run"}
];

function defaultEvents(){
  return [
    {id:"bmx1", day:"Lundi",    start:"17:45", end:"19:15", club:"bmx",   sport:"bike", activity:"BMX", loc:""},
    {id:"bmx2", day:"Mercredi", start:"14:00", end:"16:00", club:"bmx",   sport:"bike", activity:"BMX", loc:""},
    {id:"ath1", day:"Mercredi", start:"14:00", end:"16:00", club:"stade", sport:"run",  activity:"Athlétisme", loc:""},
    {id:"ath2", day:"Mercredi", start:"16:00", end:"18:00", club:"stade", sport:"run",  activity:"Athlétisme", loc:""},
    {id:"ath3", day:"Vendredi", start:"18:00", end:"20:00", club:"stade", sport:"run",  activity:"Athlétisme", loc:""},
    {id:"trA1", day:"Lundi",    start:"18:00", end:"19:00", club:"tri", sport:"",     activity:"PPG (TRG & Jeunes perf.)", loc:"Les Vernets ou lac"},
    {id:"trA2", day:"Mardi",    start:"13:00", end:"14:30", club:"tri", sport:"swim", activity:"Natation TRG", loc:"Marignac"},
    {id:"trA3", day:"Mercredi", start:"14:00", end:"15:00", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Chandieu"},
    {id:"trA4", day:"Jeudi",    start:"13:00", end:"14:30", club:"tri", sport:"swim", activity:"Natation TRG", loc:"Marignac"},
    {id:"trA5", day:"Vendredi", start:"13:00", end:"14:30", club:"tri", sport:"swim", activity:"Natation TRG", loc:"Marignac"},
    {id:"trA6", day:"Samedi",   start:"11:00", end:"12:30", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Pâquis centre"},
    {id:"trA7", day:"Lundi",    start:"18:00", end:"19:00", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Les Vernets ou lac"},
    {id:"trA8", day:"Mardi",    start:"18:00", end:"19:30", club:"tri", sport:"run",  activity:"Course à pied Jeunes tous niveaux", loc:"Bout-du-monde"},
    {id:"trA9", day:"Mercredi", start:"16:15", end:"18:15", club:"tri", sport:"bike", activity:"Vélo (TRG & jeunes perf.)", loc:"Bout-du-monde"},
    {id:"trA10",day:"Jeudi",    start:"18:00", end:"19:30", club:"tri", sport:"bike", activity:"Transitions Jeunes tous niveaux (VTT/CAP)", loc:"Bout-du-monde"},
    {id:"trA11",day:"Vendredi", start:"19:00", end:"20:00", club:"tri", sport:"swim", activity:"Natation (TRG & Jeunes perf.)", loc:"Les Vernets ou lac"},
    {id:"trA12",day:"Samedi",   start:"18:30", end:"20:00", club:"tri", sport:"run",  activity:"Transitions (TRG & jeunes perf.)", loc:"CO Marais"},
    {id:"trA13",day:"Mardi",    start:"18:00", end:"19:15", club:"tri", sport:"swim", activity:"Natation Jeunes tous niveaux", loc:"Les Vernets", verify:true},
    {id:"trA14",day:"Vendredi", start:"18:00", end:"19:30", club:"tri", sport:"run",  activity:"Course à pied (TRG & jeunes perf.)", loc:"Bout-du-monde", verify:true}
  ];
}

let events = defaultEvents();
let assignments = {};
let editingId = null;
let kidNames = {O:"O", L:"L"};

const GH_OWNER = "infinitethinking";
const GH_REPO = "kids";
const GH_BRANCH = "main";
const GH_DATA_PATH = "planner-data.json";
const TOKEN_KEY = "kids-planner-gh-token";

function getToken(){
  return (document.getElementById("tokenInput")?.value || localStorage.getItem(TOKEN_KEY) || "").trim();
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function kidLabel(id){
  const n = (kidNames[id] || id).trim();
  return n || id;
}

function clubById(id){
  return CLUBS.find(c => c.id === id) || CLUBS[1];
}

function sportById(id){
  return SPORTS.find(s => s.id === id) || null;
}

function clubFromLegacy(type, club){
  if(club && CLUBS.some(c => c.id === club)) return club;
  if(type === "bmx") return "bmx";
  if(type === "athle") return "stade";
  return "tri";
}

function inferSport(activity, club){
  const a = (activity || "").toLowerCase();
  if(/natation|swim|aqua/.test(a)) return "swim";
  if(/vélo|velo|bike|bmx|powerwatt|vtt/.test(a)) return "bike";
  if(/course|athl|run|cap/.test(a)) return "run";
  if(club === "bmx") return "bike";
  if(club === "stade") return "run";
  return "";
}

function normalizeEvent(raw){
  const club = clubFromLegacy(raw.type, raw.club);
  const sport = sportById(raw.sport) ? raw.sport : inferSport(raw.activity, club);
  return {
    id: raw.id,
    day: raw.day,
    start: raw.start,
    end: raw.end,
    activity: raw.activity || "",
    loc: raw.loc || "",
    club,
    sport,
    verify: !!raw.verify
  };
}

function optionsHtml(list, selected, includeBlank){
  const blank = includeBlank ? `<option value="" ${!selected?'selected':''}>—</option>` : "";
  return blank + list.map(item =>
    `<option value="${item.id}" ${item.id===selected?'selected':''}>${esc(item.label)}</option>`
  ).join("");
}

function readKidNamesFromInputs(){
  const o = document.getElementById("kidNameO")?.value.trim();
  const l = document.getElementById("kidNameL")?.value.trim();
  kidNames = {O: o || "O", L: l || "L"};
}

function fillKidNameInputs(){
  const o = document.getElementById("kidNameO");
  const l = document.getElementById("kidNameL");
  if(o) o.value = kidNames.O || "O";
  if(l) l.value = kidNames.L || "L";
}

function updateKidChrome(){
  const o = kidLabel("O");
  const l = kidLabel("L");
  document.title = `Planning entraînements — ${o} & ${l}`;
  const title = document.getElementById("pageTitle");
  const sub = document.getElementById("pageSub");
  const titleO = document.getElementById("titleO");
  const titleL = document.getElementById("titleL");
  if(title) title.textContent = `Planning hebdomadaire — ${o} & ${l}`;
  if(sub) sub.textContent = `Clique sur ${o} / ${l} pour l'assigner à une séance. Utilise l'icône modifier pour le club, le sport, le jour ou l'horaire.`;
  if(titleO) titleO.textContent = `Séances de ${o}`;
  if(titleL) titleL.textContent = `Séances de ${l}`;
}

function syncTokenChrome(){
  const forget = document.getElementById("forgetTokenBtn");
  if(forget) forget.hidden = !getToken();
}

function openSettings(focusToken){
  document.getElementById("settingsDrawer").classList.add("open");
  document.getElementById("settingsDrawer").setAttribute("aria-hidden","false");
  document.getElementById("drawerBackdrop").hidden = false;
  document.getElementById("settingsBtn").classList.add("open");
  document.getElementById("settingsBtn").setAttribute("aria-expanded","true");
  fillKidNameInputs();
  syncTokenChrome();
  if(focusToken) document.getElementById("tokenInput").focus();
}

function closeSettings(){
  document.getElementById("settingsDrawer").classList.remove("open");
  document.getElementById("settingsDrawer").setAttribute("aria-hidden","true");
  document.getElementById("drawerBackdrop").hidden = true;
  document.getElementById("settingsBtn").classList.remove("open");
  document.getElementById("settingsBtn").setAttribute("aria-expanded","false");
}

function markSave(ok, errMsg){
  const btn = document.getElementById("saveBtn");
  btn.classList.remove("ok", "err");
  btn.title = ok ? "Enregistrer" : (errMsg || "Erreur d'enregistrement");
  btn.classList.add(ok ? "ok" : "err");
  if(ok){
    setTimeout(() => btn.classList.remove("ok"), 1600);
  }else if(!getToken()){
    openSettings(true);
  }
}

function encodeBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function decodeBase64(b64){
  const bin = atob(b64.replace(/\n/g, ""));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function githubHeaders(withAuth){
  const headers = {
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  const token = getToken();
  if(withAuth && token) headers.Authorization = "Bearer " + token;
  return headers;
}

function serializeState(){
  readKidNamesFromInputs();
  const compactAssignments = {};
  Object.entries(assignments).forEach(([id, a]) => {
    if(a && (a.O || a.L)) compactAssignments[id] = {O: !!a.O, L: !!a.L};
  });
  return {
    version: 2,
    updatedAt: new Date().toISOString(),
    assignments: compactAssignments,
    events: events.map(normalizeEvent),
    kidNames: {O: kidLabel("O"), L: kidLabel("L")}
  };
}

function applyState(data){
  if(!data) return;
  assignments = data.assignments && typeof data.assignments === "object" ? data.assignments : {};
  if(data.kidNames && typeof data.kidNames === "object"){
    kidNames = {
      O: (data.kidNames.O || "O").trim() || "O",
      L: (data.kidNames.L || "L").trim() || "L"
    };
  }
  if(Array.isArray(data.events) && data.events.length){
    events = data.events.map(normalizeEvent);
  }else{
    const byId = new Map(defaultEvents().map(e => [e.id, e]));
    const hidden = new Set(Array.isArray(data.hiddenIds) ? data.hiddenIds : []);
    if(data.eventPatches && typeof data.eventPatches === "object"){
      Object.entries(data.eventPatches).forEach(([id, p]) => {
        const base = byId.get(id) || {id};
        byId.set(id, normalizeEvent({...base, ...p}));
      });
    }
    if(Array.isArray(data.customEvents)){
      data.customEvents.forEach(e => byId.set(e.id, normalizeEvent(e)));
    }
    events = [...byId.values()].filter(e => !hidden.has(e.id));
  }
  fillKidNameInputs();
}

async function fetchRemoteState(){
  const res = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(GH_DATA_PATH)}?ref=${GH_BRANCH}`,
    { headers: githubHeaders(true) }
  );
  if(res.status === 404) return { sha: null, data: null };
  if(!res.ok){
    const body = await res.text();
    throw new Error(`Lecture GitHub ${res.status}: ${body}`);
  }
  const json = await res.json();
  const text = decodeBase64(json.content || "");
  return { sha: json.sha, data: text ? JSON.parse(text) : null };
}

async function saveRemoteState(){
  const token = getToken();
  if(!token){
    throw new Error("Colle un jeton GitHub avec Contents: Read and write, puis réessaie.");
  }
  localStorage.setItem(TOKEN_KEY, token);

  const payload = JSON.stringify(serializeState(), null, 2) + "\n";
  const content = encodeBase64(payload);

  async function put(sha){
    const body = {
      message: "Update planner assignments",
      content,
      branch: GH_BRANCH
    };
    if(sha) body.sha = sha;
    return fetch(
      `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(GH_DATA_PATH)}`,
      {
        method: "PUT",
        headers: { ...githubHeaders(true), "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }
    );
  }

  let { sha } = await fetchRemoteState();
  let res = await put(sha);
  if(res.status === 409){
    ({ sha } = await fetchRemoteState());
    res = await put(sha);
  }
  if(res.status === 401 || res.status === 403){
    throw new Error("Jeton refusé. Vérifie qu'il a Contents: Read and write sur infinitethinking/kids.");
  }
  if(!res.ok){
    const body = await res.text();
    throw new Error(`Enregistrement ${res.status}: ${body}`);
  }
}

function toMinutes(t){
  const [h,m] = t.split(":").map(Number);
  return h*60+m;
}

function findEvent(id){
  return events.find(e => e.id === id);
}

function getAssign(id){
  if(!assignments[id]) assignments[id] = {O:false, L:false};
  return assignments[id];
}

function overlaps(a,b){
  return a.day === b.day && toMinutes(a.start) < toMinutes(b.end) && toMinutes(b.start) < toMinutes(a.end);
}

function conflictsFor(ev, kid){
  return events.some(other => other.id !== ev.id
      && getAssign(other.id)[kid]
      && overlaps(ev, other));
}

function sportIconHtml(sportId){
  const sport = sportById(sportId);
  if(!sport) return "";
  return `<span class="material-symbols-outlined sport-icon" title="${esc(sport.label)}" aria-label="${esc(sport.label)}">${sport.icon}</span>`;
}

const SCHOOL_YEAR_START = "2026-08-17";
const SCHOOL_YEAR_END = "2027-07-05";
const ICS_UNTIL_UTC = "20270704T220000Z";
const DAY_TO_BYDAY = {Lundi:"MO",Mardi:"TU",Mercredi:"WE",Jeudi:"TH",Vendredi:"FR",Samedi:"SA"};
const DAY_TO_UTC_WEEKDAY = {Lundi:1,Mardi:2,Mercredi:3,Jeudi:4,Vendredi:5,Samedi:6};
const HOLIDAY_PERIODS = [
  ["2026-10-19","2026-10-23"],
  ["2026-12-24","2027-01-08"],
  ["2027-02-15","2027-02-19"],
  ["2027-03-26","2027-04-09"],
  ["2027-05-06","2027-05-07"]
];
const HOLIDAY_DAYS = ["2026-09-10","2027-05-17"];

function pad2(n){
  return String(n).padStart(2,"0");
}

function isoFromUtcMs(ms){
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
}

function utcMs(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return Date.UTC(y, m-1, d);
}

function addDaysIso(iso, n){
  return isoFromUtcMs(utcMs(iso) + n*86400000);
}

function utcWeekday(iso){
  return new Date(utcMs(iso)).getUTCDay();
}

function expandToSaturday(endIso){
  const w = utcWeekday(endIso);
  if(w === 0 || w === 6) return endIso;
  return addDaysIso(endIso, 6 - w);
}

function eachIsoInclusive(start, end){
  const out = [];
  for(let d = start; d <= end; d = addDaysIso(d, 1)) out.push(d);
  return out;
}

const HOLIDAY_SET = (()=>{
  const set = new Set(HOLIDAY_DAYS);
  HOLIDAY_PERIODS.forEach(([start, end])=>{
    eachIsoInclusive(start, expandToSaturday(end)).forEach(d => set.add(d));
  });
  return set;
})();

function weeklyDates(weekday, startIso, endExclusive){
  let d = startIso;
  while(utcWeekday(d) !== weekday) d = addDaysIso(d, 1);
  const out = [];
  while(d < endExclusive){
    out.push(d);
    d = addDaysIso(d, 7);
  }
  return out;
}

function icsDateTime(isoDate, hm){
  const [h, m] = (hm || "00:00").split(":");
  return isoDate.replace(/-/g,"") + "T" + pad2(Number(h)) + pad2(Number(m)) + "00";
}

function icsEscape(value){
  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/\n/g,"\\n")
    .replace(/;/g,"\\;")
    .replace(/,/g,"\\,");
}

function icsFold(line){
  const parts = [];
  while(line.length > 75){
    parts.push(line.slice(0,75));
    line = " " + line.slice(75);
  }
  parts.push(line);
  return parts.join("\r\n");
}

function eventSummary(ev){
  const a = getAssign(ev.id);
  const names = KID_IDS.filter(k => a[k]).map(kidLabel);
  if(!names.length) return ev.activity;
  return `${ev.activity} — ${names.join(" & ")}`;
}

function icsFilename(ev){
  const slug = (ev.activity || "seance")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .slice(0,40);
  return `${slug || "seance"}-${ev.day}.ics`;
}

function buildIcs(ev){
  const weekday = DAY_TO_UTC_WEEKDAY[ev.day];
  const byday = DAY_TO_BYDAY[ev.day];
  if(weekday == null || !byday) return "";
  const dates = weeklyDates(weekday, SCHOOL_YEAR_START, SCHOOL_YEAR_END);
  const skipped = dates.filter(d => HOLIDAY_SET.has(d) && d > first);
  const kept = dates.filter(d => !HOLIDAY_SET.has(d));
  if(!kept.length) return "";
  const first = kept[0];
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//infinitethinking//kids planner//FR",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:kids-${ev.id}@infinitethinking.github.io`,
    `DTSTAMP:${stamp}`,
    `DTSTART;TZID=Europe/Zurich:${icsDateTime(first, ev.start)}`,
    `DTEND;TZID=Europe/Zurich:${icsDateTime(first, ev.end)}`,
    `RRULE:FREQ=WEEKLY;BYDAY=${byday};UNTIL=${ICS_UNTIL_UTC}`,
    icsFold("SUMMARY:" + icsEscape(eventSummary(ev)))
  ];
  if(ev.loc) lines.push(icsFold("LOCATION:" + icsEscape(ev.loc)));
  const club = clubById(ev.club);
  const sport = sportById(ev.sport);
  const desc = [club.label, sport ? sport.label : ""].filter(Boolean).join(" · ");
  if(desc) lines.push(icsFold("DESCRIPTION:" + icsEscape(desc)));
  skipped.forEach(d => {
    lines.push(`EXDATE;TZID=Europe/Zurich:${icsDateTime(d, ev.start)}`);
  });
  lines.push("END:VEVENT", "END:VCALENDAR", "");
  return lines.join("\r\n");
}

function downloadIcs(ev){
  const text = buildIcs(ev);
  if(!text) return;
  const blob = new Blob([text], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = icsFilename(ev);
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function render(){
  updateKidChrome();
  const grid = document.getElementById('grid');
  grid.innerHTML = "";

  DAYS.forEach(day=>{
    const col = document.createElement('div');
    col.className = 'day-col';
    const dayEvents = events.filter(e=>e.day===day).sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));

    let html = `<h2>${day}</h2>`;
    if(dayEvents.length===0){
      html += `<div class="empty">—</div>`;
    }
    col.innerHTML = html;

    dayEvents.forEach(ev=>{
      const a = getAssign(ev.id);
      const oName = kidLabel("O");
      const lName = kidLabel("L");
      const cO = a.O && conflictsFor(ev,'O');
      const cL = a.L && conflictsFor(ev,'L');
      const club = clubById(ev.club);
      const div = document.createElement('div');
      div.className = `event club-${club.id}` + ((cO||cL) ? ' conflict' : '');
      div.innerHTML = `
        <div class="card-actions">
          <button class="icon-btn" data-ics="${ev.id}" type="button" title="Télécharger le calendrier" aria-label="Télécharger le calendrier">
            <span class="material-symbols-outlined">calendar_month</span>
          </button>
          <button class="icon-btn" data-edit="${ev.id}" type="button" title="Modifier" aria-label="Modifier">
            <span class="material-symbols-outlined">edit</span>
          </button>
          <button class="icon-btn del-btn" data-del="${ev.id}" type="button" title="Supprimer cette séance" aria-label="Supprimer cette séance">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
        <div class="event-head">
          ${sportIconHtml(ev.sport)}
          <div class="time">${ev.start}–${ev.end}</div>
        </div>
        <div class="activity">${esc(ev.activity)}</div>
        ${ev.loc ? `<div class="loc">${esc(ev.loc)}</div>` : ''}
        ${ev.verify ? `<div class="conflict-flag"><span class="material-symbols-outlined">warning</span>jour/heure à vérifier</div>` : ''}
        ${(cO||cL) ? `<div class="conflict-flag"><span class="material-symbols-outlined">warning</span>chevauchement pour ${cO?esc(oName):''}${cO&&cL?' & ':''}${cL?esc(lName):''}</div>` : ''}
        <div class="kid-row">
          <button class="kid-btn ${a.O?'on-O':''}" data-kid="O" data-id="${ev.id}">${esc(oName)}</button>
          <button class="kid-btn ${a.L?'on-L':''}" data-kid="L" data-id="${ev.id}">${esc(lName)}</button>
        </div>
        <div class="edit-fields ${editingId===ev.id?'show':''}" data-fields="${ev.id}">
          <select data-field="club" data-id="${ev.id}">
            ${optionsHtml(CLUBS, ev.club, false)}
          </select>
          <select data-field="sport" data-id="${ev.id}">
            ${optionsHtml(SPORTS, ev.sport, true)}
          </select>
          <select data-field="day" data-id="${ev.id}">
            ${DAYS.map(d=>`<option value="${d}" ${d===ev.day?'selected':''}>${d}</option>`).join('')}
          </select>
          <input type="text" data-field="start" data-id="${ev.id}" value="${ev.start}" placeholder="HH:MM">
          <input type="text" data-field="end" data-id="${ev.id}" value="${ev.end}" placeholder="HH:MM">
          <input type="text" data-field="activity" data-id="${ev.id}" value="${esc(ev.activity)}">
          <input type="text" data-field="loc" data-id="${ev.id}" value="${esc(ev.loc||'')}" placeholder="Lieu">
        </div>
      `;
      col.appendChild(div);
    });

    grid.appendChild(col);
  });

  renderSummary();
  renderWeekCards();
  attachHandlers();
}

function renderWeekCards(){
  const container = document.getElementById('weekCards');
  const daysWithSelection = DAYS.filter(day =>
    events.some(e => e.day === day && (getAssign(e.id).O || getAssign(e.id).L))
  );

  if(daysWithSelection.length === 0){
    container.innerHTML = `<div class="empty">Aucune séance sélectionnée pour l'instant.</div>`;
    return;
  }

  container.innerHTML = daysWithSelection.map(day=>{
    const items = events.filter(e => e.day === day && (getAssign(e.id).O || getAssign(e.id).L))
      .sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
    const itemsHtml = items.map(e=>{
      const a = getAssign(e.id);
      const chips = KID_IDS.filter(k=>a[k]).map(k=>`<span class="kid-chip ${k}">${esc(kidLabel(k))}</span>`).join('');
      const sport = sportById(e.sport);
      return `
        <div class="day-summary-item club-${clubById(e.club).id}">
          <div class="t">${sport ? `<span class="material-symbols-outlined">${sport.icon}</span>` : ''}${e.start}–${e.end}</div>
          <div class="a">${esc(e.activity)}${e.loc ? ' — '+esc(e.loc) : ''}</div>
          <div class="kids">${chips}</div>
        </div>
      `;
    }).join('');
    return `<div class="day-summary-card"><h4>${day}</h4>${itemsHtml}</div>`;
  }).join('');
}

function renderSummary(){
  KID_IDS.forEach(kid=>{
    const list = document.getElementById('list'+kid);
    const items = events.filter(e=>getAssign(e.id)[kid])
      .sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || toMinutes(a.start)-toMinutes(b.start));
    if(items.length===0){
      list.innerHTML = `<li class="empty" style="list-style:none;margin-left:-18px;">Aucune séance assignée.</li>`;
      return;
    }
    list.innerHTML = items.map(e=>{
      const conf = conflictsFor(e,kid);
      const sport = sportById(e.sport);
      return `<li class="${conf?'conflict-item':''}">${conf?'<span class="material-symbols-outlined">warning</span> ':''}${sport?'<span class="material-symbols-outlined">'+sport.icon+'</span> ':''}${e.day} ${e.start}–${e.end} — ${esc(e.activity)}${e.loc? ' ('+esc(e.loc)+')':''}</li>`;
    }).join('');
  });
}

function attachHandlers(){
  document.querySelectorAll('.kid-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id, kid = btn.dataset.kid;
      const a = getAssign(id);
      a[kid] = !a[kid];
      render();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.edit;
      editingId = (editingId === id) ? null : id;
      render();
    };
  });
  document.querySelectorAll('[data-field]').forEach(inp=>{
    inp.onchange = ()=>{
      const id = inp.dataset.id, field = inp.dataset.field;
      updateEvent(id, field, inp.value);
    };
  });
  document.querySelectorAll('[data-ics]').forEach(btn=>{
    btn.onclick = ()=>{
      const ev = findEvent(btn.dataset.ics);
      if(ev) downloadIcs(ev);
    };
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.del;
      events = events.filter(e => e.id !== id);
      delete assignments[id];
      editingId = null;
      render();
    };
  });
}

function updateEvent(id, field, value){
  const ev = findEvent(id);
  if(!ev) return;
  ev[field] = value;
  render();
}

document.getElementById('addEventBtn').addEventListener('click', ()=>{
  const id = 'custom_' + Date.now();
  events.push({
    id, day:"Lundi", start:"18:00", end:"19:00",
    club:"tri", sport:"swim", activity:"Nouvelle séance", loc:""
  });
  editingId = id;
  render();
});

document.getElementById('tokenInput').value = localStorage.getItem(TOKEN_KEY) || "";
fillKidNameInputs();
syncTokenChrome();

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  const drawer = document.getElementById('settingsDrawer');
  if(drawer.classList.contains('open')) closeSettings();
  else openSettings();
});
document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
document.getElementById('drawerBackdrop').addEventListener('click', closeSettings);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeSettings();
});

document.getElementById('kidNameO').addEventListener('input', ()=>{
  readKidNamesFromInputs();
  render();
});
document.getElementById('kidNameL').addEventListener('input', ()=>{
  readKidNamesFromInputs();
  render();
});

document.getElementById('tokenInput').addEventListener('input', syncTokenChrome);

document.getElementById('forgetTokenBtn').addEventListener('click', ()=>{
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('tokenInput').value = "";
  document.getElementById('saveBtn').classList.remove('ok','err');
  document.getElementById('saveBtn').title = 'Enregistrer';
  syncTokenChrome();
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try{
    await saveRemoteState();
    markSave(true);
  }catch(err){
    markSave(false, err.message || String(err));
  }finally{
    btn.disabled = false;
  }
});

(async function init(){
  try{
    const { data } = await fetchRemoteState();
    if(data) applyState(data);
  }catch(err){
    markSave(false, err.message || String(err));
  }
  render();
})();
</script>
